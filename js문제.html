<!DOCTYPE html>
<html lang="en">
<head>
 <script>
        window.onload = () => {
            document.querySelector('#btn').onclick = showCustomer;
        }

        async function showCustomer(){
            const id = document.querySelector('#id').value;
            const pwd = document.querySelector('#pwd').value;

            // 직원 정보 검사
            if(id !== 'python' || pwd !== '123'){
                alert('ID 또는 PWD가 틀렸습니다.');
                return;
            }

            try{
                // gogekdata.json 읽기
                const response = await fetch('gogekdata.json');

                if(!response.ok){
                    throw new Error('파일을 읽을 수 없습니다.');
                }

                const data = await response.json();

                let output = `
                    <table>
                        <tr>
                            <th>고객명</th>
                            <th>고객전화</th>
                            <th>성별</th>
                        </tr>
                `;

                data.forEach(item => {

                    // 남자면 노랑, 여자면 파랑
                    let color;

                    if(item.gender === '남'){
                        color = 'yellow';
                    }
                    else{
                        color = 'blue';
                    }

                    output += `
                        <tr>
                            <td style="color:${color}">${item.name}</td>
                            <td>${item.tel}</td>
                            <td>${item.gender}</td>
                        </tr>
                    `;
                });

                output += `</table>`;

                document.querySelector('#result').innerHTML = output;

            }catch(error){
                document.querySelector('#result').innerHTML =
                    '오류 발생 : ' + error.message;
            }
        }
    </script>
</head>

<body>
    <h3>문제2)</h3>

    <h4>직원정보 입력</h4>

    ID :
    <input type="text" id="id">
    <br>

    PWD :
    <input type="password" id="pwd">

    <button id="btn">관리 고객 출력</button>

    <hr>

    <div id="result"></div>
</body>
</html>
