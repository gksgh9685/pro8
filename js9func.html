<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    es6부터는 화살표 함수(arrow function)라는 새로운 문법 방식으로 함수를 만들 수 있게 되었다
    화살표 함수는 => 기호를 사용하여 function 키워드를 생략한다.<br>
    함수 표현식 보다 단순한 문법으로 함수 처리가 가능해진다.<br>
    형식 : let 변수 = (매개변수1,...) => {표현식}
    <br>
    <script>
        // 참고 : 'use strict';는 javascript를 엄격 모드(strict mode)로 실행하도록 하는 선언
        'use strict';
        let a = 10;
        console.log(a);
    </script>
</body>
</html>
